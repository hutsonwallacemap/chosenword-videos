# Goes in the public chosenword-videos repository as .github/workflows/update-videos.yml
# Every hour: read both YouTube channels and update videos.json for the app.
name: Update videos

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the channels
        run: node update-videos.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Save videos.json
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Update videos" && git push)
